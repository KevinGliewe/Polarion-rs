[package]
name = "polarion-soap"
description = "Async client for the Siemens Polarion ALM SOAP web services, generated from the WSDLs"
keywords = ["polarion", "alm", "soap", "wsdl", "api"]
categories = ["api-bindings", "web-programming::http-client"]
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
base64.workspace = true
reqwest = { workspace = true, features = ["cookies"] }
roxmltree.workspace = true
serde = { workspace = true, optional = true }
thiserror.workspace = true
tokio = { version = "1", default-features = false, features = ["sync"] }
url.workspace = true

[features]
# `serde::Serialize` for all types (JSON keys are the XML element names).
serde = ["dep:serde"]

[dev-dependencies]
tokio.workspace = true
wiremock.workspace = true

[lints]
workspace = true
