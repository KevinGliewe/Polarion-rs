[package]
name = "polarion"
description = "Convenient, read-focused access to Siemens Polarion ALM, built on the SOAP web services"
keywords = ["polarion", "alm", "requirements", "api"]
categories = ["api-bindings"]
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
polarion-soap = { workspace = true, features = ["serde"] }
schemars = { version = "1", optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[features]
# `schemars::JsonSchema` for the result types, describing their JSON form.
schemars = ["dep:schemars", "polarion-soap/schemars"]

[dev-dependencies]
tokio.workspace = true
wiremock.workspace = true

[lints]
workspace = true
