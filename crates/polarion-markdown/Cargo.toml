[package]
name = "polarion-markdown"
description = "Markdown to Polarion rich text (HTML) and back: work item links, formulas, tables, syntax highlighting, mermaid diagrams as SVG"
keywords = ["polarion", "markdown", "mermaid", "html", "alm"]
categories = ["text-processing", "parser-implementations"]
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# Legacy mermaid.ink image URLs (base64 of the diagram source).
base64.workspace = true
comrak = { version = "0.56", default-features = false }
# `deterministic`: attributes in source order, so raw HTML kept from Polarion stays byte-identical.
scraper = { version = "0.27", default-features = false, features = ["deterministic"] }
serde_json.workspace = true
sha2 = { version = "0.11", default-features = false }
thiserror.workspace = true
mermaid-rs-renderer = { version = "0.3.1", default-features = false, optional = true }
syntect = { version = "5.3", default-features = false, features = ["default-syntaxes", "default-themes", "html", "regex-fancy"], optional = true }

[features]
default = ["mermaid", "highlight"]
# Render mermaid diagrams to SVG (without it they stay code blocks).
mermaid = ["dep:mermaid-rs-renderer"]
# Syntax highlighting of fenced code that names its language.
highlight = ["dep:syntect"]

[lints]
workspace = true
