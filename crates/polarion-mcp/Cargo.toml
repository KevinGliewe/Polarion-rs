[package]
name = "polarion-mcp"
description = "The MCP server behind `polarion mcp` (crate polarion-cli): Siemens Polarion ALM for AI agents over stdio or Streamable HTTP. A library; install polarion-cli"
keywords = ["polarion", "alm", "mcp", "ai", "agent"]
categories = ["development-tools"]
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
axum.workspace = true
base64.workspace = true
polarion.workspace = true
polarion-commands.workspace = true
rmcp.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
tokio = { workspace = true, features = ["net", "signal"] }
tokio-util.workspace = true
tower-layer.workspace = true
toml.workspace = true

[lints]
workspace = true
