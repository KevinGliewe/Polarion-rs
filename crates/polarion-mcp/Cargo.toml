[package]
name = "polarion-mcp"
description = "MCP server (stdio or Streamable HTTP) giving AI agents access to Siemens Polarion ALM (read-only unless writes are enabled)"
keywords = ["polarion", "alm", "mcp", "ai", "agent"]
categories = ["command-line-utilities"]
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "polarion-mcp"
path = "src/main.rs"

[dependencies]
axum.workspace = true
polarion.workspace = true
polarion-commands.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
tokio = { workspace = true, features = ["net", "signal"] }

[dev-dependencies]
reqwest.workspace = true
wiremock.workspace = true

[lints]
workspace = true
