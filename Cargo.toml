[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/KevinGliewe/Polarion-rs"
authors = ["Kevin Gliewe"]

[workspace.dependencies]
polarion-rest = { path = "crates/polarion-rest", version = "0.1.0" }

anyhow = "1"
heck = "0.5"

reqwest = { version = "0.13", default-features = false, features = ["json", "query", "multipart", "rustls", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
url = "2"
wiremock = "0.6"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
