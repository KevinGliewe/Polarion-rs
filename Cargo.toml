[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/KevinGliewe/Polarion-rs"
authors = ["Kevin Gliewe"]

[workspace.dependencies]
polarion = { path = "crates/polarion", version = "0.1.0" }
polarion-commands = { path = "crates/polarion-commands", version = "0.1.0" }
polarion-commands-derive = { path = "crates/polarion-commands-derive", version = "0.1.0" }
polarion-rest = { path = "crates/polarion-rest", version = "0.1.0" }
polarion-soap = { path = "crates/polarion-soap", version = "0.1.0" }

anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["tokio", "http1"] }
base64 = "0.23"
clap = { version = "4", features = ["derive", "env", "string"] }
heck = "0.5"

roxmltree = "0.21"
rmcp = { version = "3.5", default-features = false, features = ["server", "transport-io", "transport-streamable-http-server"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "multipart", "rustls", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tokio-util = "0.7"
url = "2"
wiremock = "0.6"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
