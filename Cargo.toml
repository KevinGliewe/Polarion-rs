[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/KevinGliewe/Polarion-rs"
authors = ["Kevin Gliewe"]

[workspace.dependencies]
polarion = { path = "crates/polarion", version = "0.4.0" }
polarion-commands = { path = "crates/polarion-commands", version = "0.4.0" }
polarion-commands-derive = { path = "crates/polarion-commands-derive", version = "0.4.0" }
polarion-mcp = { path = "crates/polarion-mcp", version = "0.4.0" }
polarion-markdown = { path = "crates/polarion-markdown", version = "0.4.0", default-features = false }
polarion-soap = { path = "crates/polarion-soap", version = "0.4.0" }

anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["tokio", "http1"] }
base64 = "0.23"
clap = { version = "4", features = ["derive", "env", "string"] }
heck = "0.5"

roxmltree = "0.21"
rmcp = { version = "3.5", default-features = false, features = ["server", "transport-io", "transport-streamable-http-server"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tokio-util = "0.7"
tower-layer = "0.3"
url = "2"
wiremock = "0.6"

# The release binaries (`.github/workflows/release.yml`).
[profile.dist]
inherits = "release"
lto = "thin"
strip = true

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# mermaid-rs-renderer's layout debug assertions fire on valid diagrams, and fancy-regex (syntect)
# is unusably slow without optimization. Library users building in debug do not get these.
[profile.dev.package.mermaid-rs-renderer]
opt-level = 2
debug-assertions = false
overflow-checks = false

[profile.dev.package.fancy-regex]
opt-level = 2

[profile.dev.package.regex-automata]
opt-level = 2

[profile.dev.package.regex-syntax]
opt-level = 2

[profile.dev.package.syntect]
opt-level = 2

[profile.dev.package.bincode]
opt-level = 2

[profile.dev.package.miniz_oxide]
opt-level = 2
