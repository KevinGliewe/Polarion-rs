# The actions the workflows use: one pull request a month for all of them. It also moves the commit pins in
# release.yml, docker.yml and scheduled.yml together with their version comments.
# Cargo dependencies are not updated here; .github/workflows/scheduled.yml checks them for advisories.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]
    # Its refs select a Rust toolchain (`@1.95` is the minimum supported version in ci.yml), they are not versions
    # of the action. The commit pins of it are moved by hand.
    ignore:
      - dependency-name: dtolnay/rust-toolchain
