name: CI

# Pushes to main and pull requests. release.yml calls it too (`workflow_call`), so that a tag is tested before
# anything is published.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

# A newer push to a pull request replaces the run of the older one. Every commit on main and every tag gets a
# run of its own (the commit is part of the group), and so does a release that calls this for the same commit.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}-${{ github.event_name != 'pull_request' && github.sha || '' }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # --locked: Cargo.lock is up to date, which the release build (`cargo build --locked`) relies on.
      - name: Generated code is up to date
        run: cargo xtask codegen --check
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked
      - run: cargo test --workspace --locked
      - run: cargo doc --workspace --no-deps --locked
      # The optional parts off: the conversion without mermaid and highlighting, the library without markdown.
      - run: cargo check -p polarion-markdown --no-default-features --locked
      - run: cargo test -p polarion-markdown --no-default-features --locked
      - run: cargo check -p polarion --locked

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.89
      - uses: Swatinem/rust-cache@v2
      # Libraries only: dev-dependencies (wiremock) need a newer compiler.
      - run: cargo check --workspace --locked

  # The release ships binaries for Windows and macOS: their tests run for main, for tags and for a release started
  # by hand (called from release.yml, this sees its event), not for pull requests.
  platforms:
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
