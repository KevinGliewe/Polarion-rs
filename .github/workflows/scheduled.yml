name: Scheduled

# Once a month, and by hand (Actions > Scheduled > Run workflow): what a push does not show.
#
# - advisories: the dependencies in Cargo.lock against the RustSec advisory database, and their licenses against
#   the allow-list in deny.toml.
# - latest-deps: the tests with every dependency at its newest compatible version, which is what a user of the
#   library crates gets; Cargo.lock in the repository is not changed.
on:
  schedule:
    - cron: "17 4 3 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  advisories:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        with:
          command: check advisories licenses

  latest-deps:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
      - run: cargo update
      - run: cargo test --workspace
