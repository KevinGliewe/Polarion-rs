name: Release

# A semver tag (`v1.2.3`, `1.2.3`, `v1.2.3-rc.1`) creates the GitHub release as a draft, or keeps an existing one
# as it is and only adds to it; builds `polarion` for every platform below and attaches it as a bare executable
# (`polarion-rs-<target>`, `.exe` on Windows, each with a `.sha256`); runs the checks of CI (ci.yml) for the tag.
# When all of that passed, `finalize` publishes the draft (as the latest release unless it is a pre-release or older
# than the latest), and the crates go to crates.io (crate versions already there are skipped, so a re-run finishes a
# half-done release). The names carry no version, so that
# https://github.com/<owner>/<repo>/releases/latest/download/polarion-rs-<target> is always the newest binary.
# Started by hand (Actions > Release > Run workflow), it only builds, runs the checks and keeps the binaries as
# workflow artifacts.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
      - "[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
      - name: Version from the tag, checked against the crates
        id: version
        run: |
          crates=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.publish != []) | "\(.name) \(.version)"')
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            tag="$GITHUB_REF_NAME"
            semver='^v?(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
            if ! [[ "$tag" =~ $semver ]]; then
              echo "::error::Tag $tag is not a semantic version (1.2.3, v1.2.3, v1.2.3-rc.1)"
              exit 1
            fi
            version="${tag#v}"
          else
            tag=""
            version=$(echo "$crates" | head -1 | cut -d' ' -f2)
          fi
          wrong=$(echo "$crates" | awk -v v="$version" '$2 != v')
          if [ -n "$wrong" ]; then
            echo "::error::Crate versions differ from $version (set version in the workspace Cargo.toml):"
            echo "$wrong"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Create the release as a draft unless it exists
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG exists: only adding to it."
            exit 0
          fi
          prerelease=()
          [[ "$TAG" == *-* ]] && prerelease=(--prerelease)
          # A draft: `finalize` publishes it once every binary is attached.
          gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes --draft "${prerelease[@]}"

  build:
    needs: prepare
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-22.04, musl: true }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-22.04-arm, musl: true }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
          - { target: aarch64-pc-windows-msvc, os: windows-11-arm }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      TARGET: ${{ matrix.target }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      # Restored only: a release build never writes a cache that later runs would trust.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
          save-if: false
      - name: musl tools
        if: matrix.musl
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          target_env=$(echo "$TARGET" | tr - _)
          echo "CC_${target_env}=musl-gcc" >> "$GITHUB_ENV"
      - name: Build
        run: cargo build --locked --profile dist --target "$TARGET" -p polarion-cli
      - name: Smoke test
        run: |
          dir="target/$TARGET/dist"
          "$dir/polarion" --version
          "$dir/polarion" mcp --version
      - name: Asset
        id: asset
        run: |
          exe=""
          [[ "$TARGET" == *windows* ]] && exe=".exe"
          # No version in the name: releases/latest/download/<name> stays the same URL.
          asset="polarion-rs-$TARGET$exe"
          cp "target/$TARGET/dist/polarion$exe" "$asset"
          if command -v sha256sum > /dev/null; then
            sha256sum "$asset" > "$asset.sha256"
          else
            shasum -a 256 "$asset" > "$asset.sha256"
          fi
          echo "files=$asset $asset.sha256" >> "$GITHUB_OUTPUT"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
      - name: Attach to the release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        # --clobber: a re-run replaces this platform's binary instead of failing; nothing else is touched.
        run: gh release upload "$TAG" ${{ steps.asset.outputs.files }} --clobber
      - name: Keep as workflow artifact
        if: github.event_name != 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.asset.outputs.asset }}
          path: |
            ${{ steps.asset.outputs.asset }}
            ${{ steps.asset.outputs.asset }}.sha256
          if-no-files-found: error

  # The checks of CI, for the tagged commit (on Linux, Windows and macOS): nothing is published without them.
  test:
    uses: ./.github/workflows/ci.yml

  # Publishes the draft when it is complete: every binary of the build matrix with its checksum, and the checks
  # passed. A release that is not a draft (published by hand, or by an earlier run) is left as it is.
  finalize:
    needs: [prepare, build, test]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Every binary is attached
        run: |
          # The targets of the build matrix.
          targets="x86_64-unknown-linux-gnu x86_64-unknown-linux-musl aarch64-unknown-linux-gnu
            aarch64-unknown-linux-musl x86_64-apple-darwin aarch64-apple-darwin
            x86_64-pc-windows-msvc.exe aarch64-pc-windows-msvc.exe"
          attached=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          missing=""
          for target in $targets; do
            for name in "polarion-rs-$target" "polarion-rs-$target.sha256"; do
              echo "$attached" | grep -qxF "$name" || missing="$missing $name"
            done
          done
          if [ -n "$missing" ]; then
            echo "::error::Release $TAG lacks:$missing"
            exit 1
          fi
      - name: Publish the draft
        run: |
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" != true ]; then
            echo "Release $TAG is published already: left as it is."
            exit 0
          fi
          # Latest: a release without a pre-release part that is not older than the latest one, so that a patch
          # of an older version does not take over releases/latest/download.
          latest=false
          if [[ "$VERSION" != *-* ]]; then
            current=$(gh release view --json tagName --jq .tagName 2> /dev/null || true)
            current="${current#v}"
            newest=$(printf '%s\n%s\n' "$current" "$VERSION" | sort -V | tail -1)
            [ "$newest" = "$VERSION" ] && latest=true
          fi
          gh release edit "$TAG" --draft=false --latest="$latest"

  publish:
    needs: [prepare, build, test, finalize]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: crates-io
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::The secret CARGO_REGISTRY_TOKEN is not set (environment crates-io or repository)."
            exit 1
          fi
          # Dependencies first. cargo publish waits until each crate is in the index.
          for crate in polarion-commands-derive polarion-markdown polarion-soap polarion \
                       polarion-commands polarion-mcp polarion-cli; do
            status=$(curl -s -o /dev/null -w '%{http_code}' \
              -A "polarion-rs release (https://github.com/${GITHUB_REPOSITORY})" \
              "https://crates.io/api/v1/crates/$crate/$VERSION")
            if [ "$status" = 200 ]; then
              echo "$crate $VERSION is already on crates.io"
              continue
            fi
            cargo publish --locked -p "$crate"
          done
